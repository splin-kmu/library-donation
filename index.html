
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>註銷圖書轉贈清冊 | Library Book Redistribution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="eyebrow">LIBRARY BOOK REDISTRIBUTION</p>
    <h1 id="pageTitle">註銷圖書轉贈清冊</h1>
    <p id="pageDescription">瀏覽可索取書目，索取狀態定時更新。</p>
    <div class="language-switch" aria-label="Language">
      <button id="zhBtn" type="button" class="secondary" aria-pressed="true">中文</button>
      <button id="enBtn" type="button" class="secondary" aria-pressed="false">English</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="toolbar">
    <input
      id="search"
      type="search"
      placeholder="搜尋書名、作者、條碼或其他書目資料…"
      aria-label="搜尋書目"
    >
    <select id="statusFilter" aria-label="篩選索取狀態">
      <option value="all">全部索取狀態</option>
      <option value="available">尚可索取</option>
      <option value="claimed">已被索取</option>
    </select>
    <select id="languageFilter" aria-label="篩選語言別">
      <option value="all">全部語言</option>
      <option value="chi">中文</option>
      <option value="eng">英文</option>
      <option value="jpn">日文</option>
    </select>
    <select id="classificationFilter" aria-label="篩選分類">
      <option value="all">全部分類</option>
    </select>
    <button id="refreshBtn" class="secondary" type="button">立即更新</button>
  </section>

  <div class="summary" id="summary" aria-live="polite">正在載入書目…</div>
  <div id="message" class="message" role="status"></div>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th scope="col" data-i18n="title">書名</th>
          <th scope="col" data-i18n="author">作者</th>
          <th scope="col" data-i18n="barcode">條碼號</th>
          <th scope="col" data-i18n="language">語言別</th>
          <th scope="col" data-i18n="callNumber">索書號</th>
          <th scope="col" data-i18n="classification">分類</th>
          <th scope="col" data-i18n="location">圖書位置</th>
          <th scope="col" data-i18n="status">索取情況</th>
        </tr>
      </thead>
      <tbody id="books">
        <tr><td colspan="8">載入中…</td></tr>
      </tbody>
    </table>
  </div>

  <p class="footnote" id="footnote">
    索取狀態會自動更新；若剛完成登記，請稍候或按「立即更新」。
    本清冊不顯示讀者個人資料。
  </p>
</main>

<footer>
  <div class="wrap" id="footerText">圖書館｜註銷圖書轉贈活動</div>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
